name: Hello environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to use
        type: environment
        required: true

permissions: {}

jobs:
  hello:
    name: Hello ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Print greeting
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: echo "Hello ${TARGET_ENVIRONMENT}"
